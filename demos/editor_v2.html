<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Editor V2 | Visual Assistant</title>
    <link rel="stylesheet" href="./editor_v2.css">
</head>
<body>
<div id="app-wrapper">
    <header>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="10"/></svg>
            Mermaid <span>Editor V2</span>
        </div>
        <div class="actions">
            <button onclick="window.app.toggleTheme()">🌓 Theme</button>
            <button onclick="window.app.openFile()" class="secondary">📂 Open</button>
            <button onclick="window.app.saveToFile()" class="secondary">💾 Save</button>
            <button onclick="window.app.downloadSVG()">📥 SVG</button>
            <button onclick="window.app.downloadPNG()">📸 PNG</button>
            <button onclick="window.app.downloadPDF()" class="primary">📄 PDF</button>
        </div>
    </header>

    <main>
        <!-- Sidebar Assistant -->
        <div id="assistant-toolbar">
            <div class="tool-icon" title="Add Node" onclick="window.app.insertSnippet('node')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
            </div>
            <div class="tool-icon" title="Add Decision" onclick="window.app.insertSnippet('decision')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l10 10-10 10-10-10z"/></svg>
            </div>
            <div class="tool-icon" title="Add Edge" onclick="window.app.insertSnippet('edge')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-4-4l4 4-4 4"/></svg>
            </div>
            <div class="tool-icon" title="Add Sub-state" onclick="window.app.insertSnippet('substate')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h10v10H7z"/></svg>
            </div>
            <div class="tool-icon" title="Add Note" onclick="window.app.insertSnippet('note')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h15a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H2V3zm15 0L12 8l5 5"/></svg>
            </div>
            <div class="tool-icon" id="templates-toggle" title="Templates Library">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <div id="templates-menu" class="dropdown-menu">
                    <div class="menu-label">CURRENT TEMPLATE</div>
                    <div class="menu-item" onclick="window.app.loadTemplate('unified_v4.1')">Unified V4.1 (Business Focus)</div>
                    <div class="menu-divider"></div>
                    <div class="menu-label">SUGGESTIONS (COMING SOON)</div>
                    <div class="menu-item disabled" style="opacity: 0.5; cursor: not-allowed;">Sequence Diagram</div>
                    <div class="menu-item disabled" style="opacity: 0.5; cursor: not-allowed;">Timeline Diagram</div>
                </div>
            </div>
        </div>

        <!-- Editor -->
        <div id="editor-container">
            <div id="editor-wrapper">
                <div id="line-numbers"></div>
                <textarea id="code-editor" spellcheck="false" placeholder="Enter your Mermaid code here..."></textarea>
            </div>
            <div id="prediction-bubble">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                <span id="prediction-text">Suggestion: --> node</span>
            </div>
        </div>

        <!-- Preview -->
        <div id="preview-container">
            <div class="zoom-controls">
                <button onclick="window.app.zoomIn()" title="Zoom In">+</button>
                <button onclick="window.app.resetZoom()" title="Reset Zoom">1:1</button>
                <button onclick="window.app.zoomOut()" title="Zoom Out">-</button>
            </div>
            <div id="graph-output"></div>
        </div>
    </main>

    <div class="status-bar">
        <div id="cursor-pos">Line 1, Col 1</div>
        <div class="error-badge" id="error-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Syntax Error
        </div>
        <div id="engine-status">Engine: Mermaid JS v11.0.0</div>
    </div>
</div>

<!-- Hidden EXPORT container (isolated from UI filters) -->
<div id="export-container" style="position: absolute; left: -9999px; top: -9999px; visibility: hidden;"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="./editor_v2.js"></script>
</body>
</html>
