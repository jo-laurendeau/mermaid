<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid | Visual Pro Editor (X6 Engine)</title>
    <!-- Local AntV X6 Core & Plugins -->
    <script src="lib/x6.js"></script>
    <script src="lib/x6-plugin-export.js"></script>
    <script src="lib/x6-plugin-selection.js"></script>
    <script src="lib/layout.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-panel: #1e293b;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --professional-white: #ffffff;
            --professional-dark: #0f172a;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100vh;
        }

        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 20px;
            z-index: 10; box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        }

        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px;
        }

        h1 { font-size: 18px; margin: 0; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        .section-title {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--text-dim); margin: 20px 0 12px 0;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        #code-area {
            flex: 1; background: #0b0f1a; border: 1px solid var(--border); border-radius: 12px;
            color: #d1d5db; font-family: 'Fira Code', monospace; font-size: 13px;
            padding: 15px; resize: none; outline: none; line-height: 1.6;
        }

        .main-container { position: relative; display: flex; flex-direction: column; }
        .toolbar {
            height: 60px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border); display: flex; align-items: center;
            justify-content: flex-end; padding: 0 24px; gap: 12px;
        }

        #container { flex: 1; background: radial-gradient(var(--border) 1px, transparent 1px); background-size: 25px 25px; }

        .btn {
            padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
            font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border); }

        .footer-info {
            position: absolute; bottom: 12px; left: 24px; font-size: 11px; color: var(--text-dim);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="layout">
        <aside class="sidebar">
            <div class="header">
                <div class="logo-icon">M</div>
                <h1>Visual Pro (X6 Local)</h1>
            </div>

            <div class="section-title">Mermaid Code</div>
            <textarea id="code-area" spellcheck="false">stateDiagram-v2
    state "Active State" as Active {
        [*] --> Idle
        Idle --> Processing
        Processing --> Idle
    }
    [*] --> Active
    Active --> [*]</textarea>

            <div style="margin-top: 15px;">
                <button class="btn btn-primary" style="width: 100%;" onclick="syncCanvas()">
                    Sync Canvas
                </button>
            </div>
        </aside>

        <main class="main-container">
            <div class="toolbar">
                <button class="btn btn-secondary" onclick="exportPNG()">PNG</button>
                <button class="btn btn-secondary" onclick="exportSVG()">SVG</button>
            </div>
            <div id="container"></div>
            <div class="footer-info">Local X6 Engine V5.0 | Professional Theme</div>
        </main>
    </div>

    <script>
        const { Graph, Shape } = X6;

        // --- THEME CONFIG ---
        const THEME = {
            fill: '#ffffff',
            stroke: '#0f172a',
            text: '#0f172a',
            compositeFill: 'rgba(99, 102, 241, 0.05)',
            compositeStroke: '#6366f1'
        };

        // --- CUSTOM SHAPES ---

        Graph.registerNode('mermaid-state', {
            inherit: 'rect',
            width: 120, height: 44,
            attrs: {
                body: { fill: THEME.fill, stroke: THEME.stroke, strokeWidth: 2, rx: 10, ry: 10 },
                label: { fill: THEME.text, fontSize: 13, fontWeight: 600 }
            }
        });

        Graph.registerNode('mermaid-composite', {
            inherit: 'rect',
            width: 350, height: 250,
            attrs: {
                body: { fill: THEME.compositeFill, stroke: THEME.compositeStroke, strokeWidth: 2, strokeDasharray: '5 5', rx: 12, ry: 12 },
                label: { fill: THEME.compositeStroke, fontSize: 13, fontWeight: 'bold', refY: 15, refX: 15, textAnchor: 'start' }
            }
        });

        Graph.registerNode('mermaid-start', {
            inherit: 'circle',
            width: 20, height: 20,
            attrs: {
                body: { fill: THEME.stroke, stroke: THEME.stroke, strokeWidth: 0 }
            }
        });

        Graph.registerNode('mermaid-end', {
            inherit: 'circle',
            width: 24, height: 24,
            markup: [
                { tagName: 'circle', selector: 'outer' },
                { tagName: 'circle', selector: 'inner' },
            ],
            attrs: {
                outer: { r: 12, cx: 12, cy: 12, fill: 'transparent', stroke: THEME.stroke, strokeWidth: 2 },
                inner: { r: 6, cx: 12, cy: 12, fill: THEME.stroke, stroke: 'none' }
            }
        });

        Graph.registerNode('mermaid-choice', {
            inherit: 'polygon',
            width: 40, height: 40,
            attrs: {
                body: {
                    refPoints: '0,10 10,0 20,10 10,20',
                    fill: THEME.fill, stroke: THEME.stroke, strokeWidth: 2
                }
            }
        });

        // --- GRAPH INIT ---

        const graph = new Graph({
            container: document.getElementById('container'),
            background: { color: 'transparent' },
            grid: { size: 10, visible: true, type: 'dot', args: { color: '#334155', thickness: 1 } },
            autoResize: true, panning: true,
            mousewheel: { enabled: true, modifiers: ['ctrl', 'meta'] },
            selecting: { enabled: true, rubberband: true, showNodeSelectionBox: true },
            connecting: {
                snap: true, allowBlank: false, allowLoop: true, highlight: true,
                router: { name: 'metro' }, connector: { name: 'rounded' }
            },
            embedding: {
                enabled: true,
                findParent({ node }) {
                    const bbox = node.getBBox();
                    return this.getNodes().filter((n) => {
                        if (n.shape === 'mermaid-composite') {
                            return n.getBBox().containsRect(bbox);
                        }
                        return false;
                    });
                },
            },
        });

        graph.use(new X6PluginExport.Export());
        graph.use(new X6PluginSelection.Selection());

        // --- PARSER & SYNC ---

        function syncCanvas() {
            const code = document.getElementById('code-area').value;
            graph.clearCells();
            
            const lines = code.split('\n');
            const stack = []; 
            const nodes = {}; // id -> Node
            let terminalCount = 0;

            const getOrCreate = (id, parent = null, typeOverride = null) => {
                const isTerminal = (id === '[*]');
                const realId = isTerminal ? `terminal_${parent ? parent.id : 'root'}_${terminalCount++}` : id;
                
                if (nodes[realId]) {
                    const node = nodes[realId];
                    if (parent && node.getParent() !== parent) {
                        parent.addChild(node);
                    }
                    return node;
                }

                let shapeType = typeOverride || 'mermaid-state';
                let labelText = isTerminal ? '' : id;

                if (isTerminal) {
                    const hasStart = graph.getNodes().some(n => n.shape === 'mermaid-start' && n.getParent() === parent);
                    shapeType = hasStart ? 'mermaid-end' : 'mermaid-start';
                }

                const node = graph.addNode({
                    id: realId, shape: shapeType, label: labelText,
                    width: shapeType === 'mermaid-composite' ? 300 : (shapeType.includes('terminal') ? 20 : 120),
                    height: shapeType === 'mermaid-composite' ? 200 : (shapeType.includes('terminal') ? 20 : 44),
                    x: Math.random() * 100, y: Math.random() * 100 // Seed, layout below
                });

                if (parent) parent.addChild(node);
                nodes[realId] = node;
                return node;
            };

            // Two-pass approach
            // Pass 1: Handle State Declarations & Hierarchies
            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('stateDiagram') || trimmed.startsWith('%%')) return;

                // Composite Open
                const compositeMatch = trimmed.match(/^state\s+(?:["'](.*?)["']\s+as\s+)?([a-zA-Z0-9_]+)\s*\{/);
                if (compositeMatch) {
                    const name = compositeMatch[1] || "";
                    const id = compositeMatch[2];
                    const parent = getOrCreate(id, stack[stack.length - 1] || null, 'mermaid-composite');
                    if (name) parent.attr('label/text', name);
                    stack.push(parent);
                    return;
                }
                if (trimmed === '}') { stack.pop(); return; }

                // Choice
                const choiceMatch = trimmed.match(/^state\s+([a-zA-Z0-9_]+)\s+<<choice>>/);
                if (choiceMatch) { getOrCreate(choiceMatch[1], stack[stack.length - 1] || null, 'mermaid-choice'); return; }

                // Transitions (just find nodes, don't link yet)
                if (trimmed.includes('-->')) {
                    const parts = trimmed.split('-->');
                    const srcId = parts[0].trim();
                    const rest = parts[1].trim();
                    const tgtId = rest.split(':')[0].trim();
                    getOrCreate(srcId, stack[stack.length - 1] || null);
                    getOrCreate(tgtId, stack[stack.length - 1] || null);
                }

                // Description
                const descMatch = trimmed.match(/^([a-zA-Z0-9_]+)\s*:\s*(.*)/);
                if (descMatch) {
                    const node = getOrCreate(descMatch[1], stack[stack.length - 1] || null);
                    node.attr('label/text', descMatch[2]);
                }
            });

            // Pass 2: Handle Transitions
            stack.length = 0; // Reset stack for second pass
            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.startsWith('state')) {
                    if (trimmed.includes('{')) {
                        const id = trimmed.match(/([a-zA-Z0-9_]+)\s*\{/)[1];
                        stack.push(nodes[id]);
                    }
                    return;
                }
                if (trimmed === '}') { stack.pop(); return; }

                if (trimmed.includes('-->')) {
                    const parts = trimmed.split('-->');
                    const srcId = parts[0].trim();
                    const rest = parts[1].trim();
                    const hasLabel = rest.includes(':');
                    const tgtId = hasLabel ? rest.split(':')[0].trim() : rest;
                    const label = hasLabel ? rest.split(':')[1].trim() : "";

                    const currentParent = stack[stack.length - 1] || null;
                    const srcNode = getOrCreate(srcId, currentParent);
                    const tgtNode = getOrCreate(tgtId, currentParent);

                    graph.addEdge({
                        source: srcNode, target: tgtNode, label: label,
                        attrs: { line: { stroke: '#64748b', strokeWidth: 2, targetMarker: 'classic' } }
                    });
                }
            });

            // Pass 3: Heirarchical Layout
            const layoutNode = (node, depth = 0) => {
                const children = node.getChildren() || [];
                if (children.length === 0) return;

                children.forEach((child, idx) => {
                    const x = 40 + (idx % 2) * 180;
                    const y = 60 + Math.floor(idx / 2) * 100;
                    child.position(x, y, { relative: true });
                    layoutNode(child, depth + 1);
                });
                
                // Adjust parent size to fit children
                const bbox = node.getBBox(); // This might be relative or absolute...
                // Simplify: just fixed large sizes for composites if they have children
                if (children.length > 0) {
                    const rows = Math.ceil(children.length / 2);
                    node.resize(400, rows * 120 + 60);
                }
            };

            const rootNodes = graph.getNodes().filter(n => !n.getParent());
            rootNodes.forEach((node, idx) => {
                node.position(100 + (idx % 2) * 500, 100 + Math.floor(idx / 2) * 400);
                layoutNode(node);
            });
        }

        // --- BACKWARD SYNC ---
        function updateCode() {
            let code = "stateDiagram-v2\n";
            const nodes = graph.getNodes();
            const visited = new Set();

            nodes.filter(n => n.shape === 'mermaid-composite').forEach(parent => {
                code += `    state "${parent.label}" as ${parent.id} {\n`;
                (parent.getChildren() || []).forEach(child => {
                    const cid = child.id.startsWith('terminal_') ? '[*]' : child.id;
                    if (child.shape === 'mermaid-choice') code += `        state ${cid} <<choice>>\n`;
                    else if (!cid.includes('terminal_')) code += `        ${cid}\n`;
                    visited.add(child.id);
                });
                code += "    }\n";
                visited.add(parent.id);
            });

            nodes.filter(n => !visited.has(n.id) && n.shape !== 'mermaid-start' && n.shape !== 'mermaid-end').forEach(node => {
                if (node.shape === 'mermaid-choice') code += `    state ${node.id} <<choice>>\n`;
                else code += `    ${node.id}\n`;
            });

            graph.getEdges().forEach(edge => {
                const s = edge.getSourceNode();
                const t = edge.getTargetNode();
                if (!s || !t) return;
                const sid = s.id.startsWith('terminal_') ? '[*]' : s.id;
                const tid = t.id.startsWith('terminal_') ? '[*]' : t.id;
                const label = edge.getLabels()[0]?.attrs?.text?.text || "";
                code += `    ${sid} --> ${tid}${label ? " : " + label : ""}\n`;
            });

            document.getElementById('code-area').value = code.trim();
        }

        graph.on('node:moved', updateCode);
        graph.on('node:added', updateCode);
        graph.on('node:removed', updateCode);
        graph.on('edge:connected', updateCode);

        // --- UTILS ---
        function exportPNG() { graph.exportPNG('diagram.png', { padding: 20, backgroundColor: '#ffffff' }); }
        function exportSVG() { graph.exportSVG('diagram.svg', { padding: 20 }); }

        window.onload = syncCanvas;
    </script>
</body>
</html>
